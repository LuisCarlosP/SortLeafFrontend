<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>SortLeaf</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect
      // This script redirects all 404s to index.html with the original path as a query parameter
      var base = '%BASE_URL%';
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        base + '?/' +
        l.pathname.slice(base.length).replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
